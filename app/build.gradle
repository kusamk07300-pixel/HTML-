plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 36
    defaultConfig {
        applicationId "qmyy.babycat.live"
        minSdk 21
        targetSdk 36
        versionCode 4
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.11.0'
    
    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    
    // RXJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'
    
    // Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'
    implementation 'androidx.media3:media3-common:1.1.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.1.1'
    
    // Smart Refresh Layout
    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.5'
    implementation 'com.scwang.smart:refresh-header-classics:2.0.5'
    implementation 'com.scwang.smart:refresh-footer-classics:2.0.5'
    
    // LitePal Database
    implementation 'org.litepal.guolindev:core:3.2.3'
    
    // SVGA Player
    implementation 'com.github.yyued:SVGAPlayer-Android:2.4.3'
    
    // Photo Picker
    implementation 'io.github.lucksiege:picture-selector:v2.6.1'
    implementation 'io.github.lucksiege:compress:v3.3.2'
    implementation 'io.github.lucksiege:ucrop:v2.2.4'
    
    // Auto Size
    implementation 'me.jessyan:autosize:1.2.1'
    
    // ImmersionBar
    implementation 'com.gyf.immersionbar:immersionbar:3.0.0'
    implementation 'com.gyf.immersionbar:immersionbar-components:3.0.0'
    
    // Tencent TUikit (IM SDK)
    implementation 'com.github.tencentcloudbase/tuikit:im:4.3.0'
    implementation 'com.github.tencentcloudbase/tuikit:conversation:4.3.0'
    implementation 'com.github.tencentcloudbase/tuikit:contact:4.3.0'
    implementation 'com.github.tencentcloudbase/tuikit:chat:4.3.0'
    implementation 'com.github.tencentcloudbase/tuikit:group:4.3.0'
    
    // Tencent TRTC
    implementation 'com.tencent.rtmp:tuicallengine:4.3.0'
    
    // Google Play Services
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'
    
    // Billing
    implementation 'com.android.billingclient:billing:5.2.0'
    
    // RecyclerView & ViewPager2
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta02'
    
    // Bottom Navigation
    implementation 'com.google.android.material:material:1.11.0'
    
    // Loading & UI Utils
    implementation 'com.blankj:utilcodex:1.31.1'
    
    // XPopup
    implementation 'com.github.li-xiaojiong:XPopup:2.9.0'
    
    // QRCode
    implementation 'cn.bingoogolapple:bga-qrcodecore:1.1.7'
    implementation 'cn.bingoogolapple:bga-zxing:1.1.7'
    
    // Circle ImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    
    // Kingfisher (Image loading alternative)
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    
    // Network Monitor
    implementation 'com.github.anggrayudi:network:1.1.2'
    
    // LiveKit (for future backend)
    implementation 'io.livekit:livekit-client:2.0.0'
    
    // Jetpack Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}